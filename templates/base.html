<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Life Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
            color: #e5e7eb;
        }
        .card {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
        }
        .btn {
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .nav-link {
            position: relative;
            transition: color 0.3s;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #3b82f6;
            transition: width 0.3s;
        }
        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }
        .form-input {
            background-color: #374151;
            border: 1px solid #4b5563;
            color: #e5e7eb;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-gray-900/80 backdrop-blur-sm shadow-lg sticky top-0 z-50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="{% url 'daily_challenge' %}" class="text-2xl font-bold text-white tracking-wider">ChallengeApp</a>
            <div>
                {% if user.is_authenticated %}
                    <a href="{% url 'daily_challenge' %}" class="nav-link text-gray-300 hover:text-white mx-3 {% if request.resolver_match.url_name == 'daily_challenge' %}active{% endif %}">Home</a>
                    <a href="{% url 'progress' %}" class="nav-link text-gray-300 hover:text-white mx-3 {% if request.resolver_match.url_name == 'progress' %}active{% endif %}">Progress</a>
                    <a href="{% url 'history' %}" class="nav-link text-gray-300 hover:text-white mx-3 {% if request.resolver_match.url_name == 'history' %}active{% endif %}">History</a>
                    <span class="text-gray-400 mx-3">|</span>
                    <span class="text-gray-300 mr-4">Welcome, {{ user.username }}</span>
                    <form action="{% url 'logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="btn bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="nav-link text-gray-300 hover:text-white mx-3 {% if request.resolver_match.url_name == 'login' %}active{% endif %}">Login</a>
                    <a href="{% url 'register' %}" class="nav-link text-gray-300 hover:text-white mx-3 {% if request.resolver_match.url_name == 'register' %}active{% endif %}">Register</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main class="flex-grow container mx-auto px-6 py-12">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>

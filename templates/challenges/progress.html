{% extends 'base.html' %}

{% block content %}
<div class="text-center mb-12">
    <h1 class="text-5xl font-extrabold text-white">Your Progress</h1>
    <p class="text-gray-400 mt-2">Visualize your journey of self-improvement.</p>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <div class="card p-6">
        <h2 class="text-2xl font-bold mb-4 text-center text-white">Completions by Category</h2>
        <canvas id="categoryChart"></canvas>
    </div>
    <div class="card p-6">
        <h2 class="text-2xl font-bold mb-4 text-center text-white">Completions Over Time</h2>
        <canvas id="dailyChart"></canvas>
    </div>
</div>
{% endblock %}
